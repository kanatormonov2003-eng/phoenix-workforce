name: staging-migration

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging:
    # GitHub does not expose secrets to fork PRs. Same-repository PRs and manual runs may use staging secrets.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Supabase version
        run: supabase --version
      - name: Link staging project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_STAGING_PROJECT_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
        run: test -n "$SUPABASE_ACCESS_TOKEN" && test -n "$SUPABASE_STAGING_PROJECT_REF" && supabase link --project-ref "$SUPABASE_STAGING_PROJECT_REF"
      - name: Lint database
        run: supabase db lint
      - name: Validate migration plan
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push --dry-run
      - name: Apply migrations to staging only
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push
